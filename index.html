<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chessy</title>
  </head>
  <body>
    <div class="app">
      <nav class="navbar">
        <div class="brand">Chessy</div>
        <div class="status">
          <span id="turnDot" class="turn-dot"></span>
          <span id="turnText" class="turn-text">White's turn</span>
        </div>
        <div class="navbar-actions">
          <button class="btn btn-primary" type="button" id="newGameBtn">New Game</button>
        </div>
      </nav>
      <div class="layout">
        <div id="board-container">
          <div id="board-grid">
            <div class="coords coords-files coords-files-top">
              <span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span>
            </div>
            <div class="coords coords-ranks coords-ranks-left">
              <span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span>
            </div>
            <div id="board-frame">
              <div id="gameOverOverlay" class="overlay game-over-overlay" hidden>
                <div class="game-over-card">
                  <div id="gameOverText"></div>
                  <button class="btn btn-primary" type="button" id="rematchBtn">Rematch</button>
                </div>
              </div>
            </div>
            <div class="coords coords-ranks coords-ranks-right">
              <span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span>
            </div>
            <div class="coords coords-files coords-files-bottom">
              <span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span>
            </div>
          </div>
        </div>
        <aside class="panel">
          <div class="panel-header">
            <h2>Moves</h2>
            <div class="export-actions">
              <button class="btn" type="button" id="exportPgnBtn">PGN</button>
              <button class="btn" type="button" id="exportFenBtn">FEN</button>
            </div>
          </div>
          <ol id="moveList" class="move-list"></ol>
        </aside>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
